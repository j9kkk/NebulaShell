<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Windows/Linux 满绘版:与 icon.svg 唯一区别是没有 macOS 的 80% 内缩层。
       Windows 任务栏习惯图标铺满格子(微信/钉钉均满绘),按 macOS 网格内缩会显小一圈。
       生成方式:先 npx tauri icon 本文件保留 Windows 产物,再用 icon.svg 重生成并只取 icon.icns。 -->

  <!-- 背景与内描边 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="10"/>

  <!-- 星云 -->
  <ellipse cx="392" cy="368" rx="340" ry="268" fill="url(#nebulaBlue)"/>
  <ellipse cx="636" cy="656" rx="372" ry="312" fill="url(#nebulaViolet)"/>
  <ellipse cx="566" cy="420" rx="252" ry="188" fill="url(#nebulaCyan)"/>
  <!-- 旋臂 -->
  <path d="M320 656 C 372 486, 556 420, 706 474" stroke="#8fb0ff" stroke-opacity="0.42" stroke-width="48" fill="none" stroke-linecap="round"/>
  <path d="M696 300 C 572 376, 486 522, 528 706" stroke="#d0a4f7" stroke-opacity="0.4" stroke-width="40" fill="none" stroke-linecap="round"/>

  <!-- 星点 -->
  <circle cx="238" cy="268" r="10" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="300" cy="210" r="6" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="792" cy="560" r="8" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="742" cy="806" r="7" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="470" cy="846" r="6" fill="#3ddc97" fill-opacity="0.9"/>
  <!-- 四芒星 -->
  <path d="M756 172 L772 224 L824 240 L772 256 L756 308 L740 256 L688 240 L740 224 Z" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M212 560 L222 592 L254 602 L222 612 L212 644 L202 612 L170 602 L202 592 Z" fill="#3ddc97" fill-opacity="0.85"/>

  <!-- 终端提示符 > -->
  <path d="M300 402 L512 584 L300 766" stroke="url(#prompt)" stroke-width="84" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 光标 -->
  <rect x="596" y="712" width="196" height="72" rx="34" fill="url(#prompt)"/>

</svg>
