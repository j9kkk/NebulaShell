[package]
name = "nebulashell"
version = "0.2.3"
description = "NebulaShell 星云终端 — Tauri 版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api:titleBarStyle Overlay(原生红绿灯悬浮在 webview 上)需要。
# 必须全平台开启并与 tauri.conf.json 的 app.macOSPrivateApi 一致:tauri-build 按目标
# 平台合并配置后校验特性表,不一致即构建失败(该特性在 Windows/Linux 上不生效)。
tauri = { version = "2", features = ["macos-private-api", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2" # 指纹归一(hex↔base64):兼容 Electron 时代遗留的 knownHosts 记录
uuid = { version = "1", features = ["v4"] }
keyring = "3"
aes-gcm = "0.10"
scrypt = "0.11"      # 导出文件口令派生(凭据必须加密,不能落明文)
rfd = "0.15"
dirs = "5"
chrono = "0.4"
rand = "0.8"
futures = "0.3"
notify-rust = "4"
async-trait = "0.1"

[lib]
name = "nebulashell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
codegen-units = 1

# 加密依赖在 debug 构建下未优化,scrypt(N=2^15)单次派生实测 ~2.9s,
# 会把带口令的导出/导入拖到数秒,并在持锁期间阻塞其它命令。
# 只对这几个计算密集的依赖开优化,构建时间几乎不受影响。
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

# vendored russh-sftp 2.4.0:read_dir 底层改为滑窗流水线 READDIR(见 vendor/README.md)。
# 上游 PR 合并发布后,删除本段与 vendor/ 副本即可回到 crates.io 版本。
[patch.crates-io]
russh-sftp = { path = "vendor/russh-sftp" }
