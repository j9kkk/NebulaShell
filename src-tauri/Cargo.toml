[package]
name = "nebulashell"
version = "1.0.1"
description = "NebulaShell 星云终端 — Tauri 版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
aes-gcm = "0.10"
rfd = "0.15"
dirs = "5"
chrono = "0.4"
rand = "0.8"
futures = "0.3"
notify-rust = "4"
async-trait = "0.1"

[lib]
name = "nebulashell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
