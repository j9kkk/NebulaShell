name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy 目前仍有 dead_code 等警告(见 lib 生成的 20 warnings),暂作提示不阻断
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml
        continue-on-error: true

      - name: 运行测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ui-e2e:
    name: UI 端到端测试 (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build:web

      - name: 构建应用 (debug)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # 说明:UI e2e 通过 NEBULA_TEST 测试桥驱动 webview(注入 JS + invoke 回传)。
      # 该机制在本地 macOS 可用,但在 GitHub 无 GUI runner 上 eval 结果无法回传,
      # 故此处标记为 allowed-failure,仅作冒烟参考;完整 UI 回归以本地运行为准。
      - name: 运行 UI e2e
        run: npm run test:web
        continue-on-error: true

  build:
    name: 构建检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build:web

      # CI 无签名证书:不设 APPLE_SIGNING_IDENTITY(设空串会触发 codesign 并因找不到身份而失败)。
      # Linux 只做编译验证(打包需额外系统依赖);macOS/Windows 走完整 bundle。
      - name: 构建
        run: npx tauri build ${{ matrix.args }}${{ matrix.os == 'ubuntu-22.04' && ' --no-bundle' || '' }}
